[project]
name = "geovision"
version = "0.1.0"
description = "Automated geospatial reporting pipeline: AOI in, reviewed regulatory report out."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # contracts / config
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # vector
    "numpy>=1.26",
    "shapely>=2.1",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "pyproj>=3.6",
    "osmnx>=2.0",
    # raster / STAC
    "pystac-client>=0.8",
    "planetary-computer>=1.0",
    "odc-stac>=0.3.10",
    "xarray>=2024.6",
    "rioxarray>=0.17",
    "dask[array]>=2024.6",
    # storage
    "fsspec>=2024.6",
    # reporting
    "matplotlib>=3.9",
    "jinja2>=3.1",
]

[project.optional-dependencies]
orchestration = ["dagster>=1.9", "dagster-webserver>=1.9"]
review = ["streamlit>=1.40", "leafmap>=0.40"]
cloud = ["s3fs>=2024.6", "adlfs>=2024.7"]

[project.scripts]
geovision = "geovision.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geovision"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call external STAC/OSM endpoints (deselect with -m 'not network')"]
addopts = "-m 'not network'"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["src/geovision/carto/render.py"]

[tool.dagster]
module_name = "geovision.orchestration.definitions"
